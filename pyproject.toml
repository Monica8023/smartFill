[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "smartfill"
version = "0.1.0"
description = "Semantic, policy-controlled browser form filling platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "openpyxl>=3.1,<4.0",
  "playwright>=1.58,<2.0",
  "pydantic-settings>=2.7,<3.0",
  "pymysql>=1.1,<2.0",
  "python-multipart>=0.0.20,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2.0",
  "pip-audit>=2.8,<3.0",
  "pytest>=9.0.3,<10.0",
  "pytest-asyncio>=1.0,<2.0",
  "pytest-cov>=6.0,<8.0",
  "ruff>=0.9,<1.0",
  "types-openpyxl>=3.1,<4.0",
]

[project.scripts]
smartfill = "smartfill.__main__:main"
smartfill-vision-poc = "smartfill.vision_poc:main"

[tool.hatch.build.targets.wheel]
packages = ["src/smartfill"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=smartfill --cov-report=term-missing --cov-fail-under=80"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["smartfill"]
